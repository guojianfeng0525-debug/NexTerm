name: Build Windows Portable (Fixed WebView2)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows-portable:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm (version from packageManager field)
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # russh 0.62 uses aws-lc-rs (default feature), which builds from C
      # sources on Windows and needs CMake. GitHub's windows-latest image
      # ships CMake, Perl and NASM — verify they are present so a missing
      # toolchain fails early with a clear message.
      - name: Verify Windows build toolchain (CMake + Perl + NASM)
        shell: pwsh
        run: |
          cmake --version | Select-Object -First 1
          perl --version | Select-Object -First 1
          nasm -v

      # Download the official WebView2 Fixed Version Runtime (.cab, x64) and
      # expand it. This is Microsoft's distribution format for fixed-version
      # runtimes — the extracted folder contains msedge.exe + msedge.dll and is
      # used as the Fixed Runtime for the portable build. The exact version is
      # captured into the runtime manifest by the packaging script, so every
      # build artifact pins the version it was built against.
      - name: Download & expand WebView2 Fixed Runtime (x64)
        shell: pwsh
        run: |
          $outDir = "$env:RUNNER_TEMP\webview2-runtime"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null

          Write-Host "Resolving the official Fixed Version .cab (x64) link..."
          $page = (Invoke-WebRequest -Uri "https://developer.microsoft.com/en-us/microsoft-edge/webview2/" -UseBasicParsing).Content
          $pattern = 'https:\\u002F\\u002F[^"'']*?Microsoft\.WebView2\.FixedVersionRuntime\.\d+\.\d+\.\d+\.\d+\.x64\.cab'
          $m = [regex]::Match($page, $pattern)
          if (-not $m.Success) {
            Write-Error "Could not locate the WebView2 Fixed Version .cab (x64) link on the official page"
            exit 1
          }
          $cabUrl = $m.Value.Replace('\u002F', '/')
          Write-Host "Fixed Runtime cab: $cabUrl"

          $cab = "$env:RUNNER_TEMP\webview2-runtime.cab"
          Write-Host "Downloading runtime (about 130MB)..."
          Invoke-WebRequest -Uri $cabUrl -OutFile $cab

          Write-Host "Expanding runtime files..."
          # 7-Zip handles standard .cab archives natively and writes to an
          # explicit output directory (no destination ambiguity).
          $7z = "C:\Program Files\7-Zip\7z.exe"
          if (Test-Path $7z) {
            & $7z x $cab "-o$outDir" -y | Out-Null
            if ($LASTEXITCODE -ne 0) { Write-Error "7z cab extraction failed with exit $LASTEXITCODE"; exit 1 }
          } else {
            # Fallback: expand with an explicit directory destination.
            expand -F:* $cab "$outDir\"
            if ($LASTEXITCODE -ne 0) { Write-Error "expand failed with exit $LASTEXITCODE"; exit 1 }
          }

          # Verify the runtime is actually usable before continuing.
          $msedge = Get-ChildItem $outDir -Recurse -Filter msedgewebview2.exe -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $msedge) {
            Write-Host "outDir listing:"
            Get-ChildItem $outDir -Force -ErrorAction SilentlyContinue | Select-Object -First 20 Name
            Write-Host "Searching RUNNER_TEMP for msedge.exe..."
            Get-ChildItem $env:RUNNER_TEMP -Recurse -Filter msedgewebview2.exe -ErrorAction SilentlyContinue |
              Select-Object -First 5 FullName
            Write-Error "WebView2 runtime extraction failed: msedgewebview2.exe not found"
            exit 1
          }
          Write-Host "runtime msedge.exe: $($msedge.FullName)"
          Get-ChildItem (Split-Path $msedge.FullName) -Name | Select-Object -First 10

      - name: Build release binary
        shell: pwsh
        run: pnpm tauri build --no-bundle

      - name: Assemble portable distribution + ZIP
        shell: pwsh
        run: |
          node scripts/build-windows-portable.mjs --runtime "$env:RUNNER_TEMP\webview2-runtime"

      - name: Upload portable artifact (single ZIP)
        uses: actions/upload-artifact@v4
        with:
          name: NexTerm-portable
          path: dist/NexTerm-portable.zip
          if-no-files-found: error

      # Publish a GitHub Release when a version tag (v*) is pushed.
      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/NexTerm-portable.zip
          generate_release_notes: true
