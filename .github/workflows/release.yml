name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing version tag to publish (for example, v2.7.1)
        required: true
        type: string
      prerelease:
        description: Mark the GitHub release as a prerelease
        required: false
        default: false
        type: boolean

jobs:
  # Publish the release BEFORE any build starts.
  #
  # tauri-action can only attach assets to a release it can look up by tag,
  # and the by-tag lookup cannot see draft releases. When no published
  # release exists it tries to create one, which fails with
  # "Resource not accessible by integration" (observed on v2.14.0, where the
  # platform jobs raced the portable workflow and lost). Creating and
  # publishing the release up front — via softprops/action-gh-release, the
  # same action the portable workflow already uses successfully — removes
  # that race: every build job then finds a published release and only
  # uploads assets.
  create-release:
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create and publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          name: nexterm ${{ inputs.tag || github.ref_name }}
          draft: false
          prerelease: ${{ inputs.prerelease || false }}
          # No explicit body: softprops preserves the body of an existing
          # release (important when re-running this workflow to repair a
          # botched release); notes for fresh releases come from the portable
          # workflow's generate_release_notes.

  release:
    needs: create-release
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: '--target aarch64-apple-darwin'
            rust_target: 'aarch64-apple-darwin'
          - platform: macos-latest
            args: '--target x86_64-apple-darwin'
            rust_target: 'x86_64-apple-darwin'
          - platform: ubuntu-latest
            args: ''
            rust_target: ''
          - platform: windows-latest
            # 64-bit Windows installer (the runner default target).
            args: '--config {"bundle":{"windows":{"webviewInstallMode":{"type":"downloadBootstrapper","silent":true}}}}'
            rust_target: ''
          - platform: windows-latest
            # 32-bit Windows installer, distributed alongside x64.
            args: '--target i686-pc-windows-msvc --config {"bundle":{"windows":{"webviewInstallMode":{"type":"downloadBootstrapper","silent":true}}}}'
            rust_target: 'i686-pc-windows-msvc'
            # Windows installer uses the online bootstrapper (the portable
            # workflow ships the Fixed Runtime); avoids requiring WebView2/
            # on this runner.

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
          # Shared with the warm-rust-cache workflow so tag builds (whose ref
          # scope cannot read caches saved by previous tags) can restore the
          # dependency artifacts warmed on the default branch.
          shared-key: release-deps

      - name: Install dependencies (macOS)
        if: matrix.platform == 'macos-latest'
        run: |
          brew install pkg-config

      - name: Install dependencies (Linux)
        if: matrix.platform == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - name: Install frontend dependencies
        run: pnpm install

      - name: Build the app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: "${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          releaseName: "nexterm ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: false
          prerelease: "${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}"
          args: ${{ matrix.args }}

  # Generate SHA256 checksums for Homebrew
  generate-checksums:
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    permissions:
      contents: write
    steps:
      - name: Wait for release assets
        run: sleep 30

      - name: Download release assets
        uses: robinraju/release-downloader@v1.13
        with:
          tag: ${{ github.ref_name }}
          fileName: '*.dmg'
          out-file-path: assets

      - name: Generate SHA256 checksums
        run: |
          cd assets
          echo "# SHA256 Checksums for nexterm ${{ github.ref_name }}" > checksums.txt
          echo "" >> checksums.txt
          for f in *.dmg; do
            if [ -f "$f" ]; then
              sha256sum "$f" | tee -a checksums.txt
            fi
          done

      - name: Upload checksums to release
        uses: softprops/action-gh-release@v2
        with:
          files: assets/checksums.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Keep only the N most recent version releases; older ones are deleted
  # entirely (release + tag + assets). Runs after every successful release.
  cleanup-old-releases:
    needs: generate-checksums
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/') || inputs.tag != ''
    permissions:
      contents: write
    env:
      KEEP: "3"
    steps:
      - name: Delete releases older than the newest ${{ env.KEEP }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          # Stable releases only (draft/prerelease never block the rotation).
          # Sort by version descending; keep the first $KEEP, delete the rest.
          mapfile -t all < <(gh api --paginate "repos/$REPO/releases" \
            --jq '.[] | select(.draft == false and .prerelease == false) | [.tag_name, .id] | @tsv')
          echo "stable releases found: ${#all[@]}"

          versions=()
          declare -A id_of=()
          for row in "${all[@]}"; do
            tag="${row%%$'\t'*}"
            id="${row##*$'\t'}"
            # v2.10.1 -> 0002.0010.0001 for lexicographic ordering
            v="${tag#v}"
            key=$(echo "$v" | awk -F. '{printf "%08d.%08d.%08d", $1, $2, $3}')
            versions+=("$key|$tag|$id")
          done

          sorted=$(printf '%s\n' "${versions[@]}" | sort -r)
          i=0
          for entry in $sorted; do
            i=$((i+1))
            if [ "$i" -le "$KEEP" ]; then
              echo "keep: ${entry#*|}"
            else
              tag="${entry#*|}"; tag="${tag%%|*}"
              id="${entry##*|}"
              echo "deleting release $tag (id=$id)"
              gh api -X DELETE "repos/$REPO/releases/$id"
              echo "deleting tag $tag"
              git push https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git --delete "refs/tags/$tag" || true
            fi
          done

