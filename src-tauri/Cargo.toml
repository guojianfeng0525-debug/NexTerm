[package]
name = "nexterm"
version = "2.9.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nexterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["custom-protocol"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-wdio-webdriver = "1.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
russh = { version = "0.62", features = ["flate2"] }
russh-sftp = "2.4"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio-tungstenite = "0.29"
futures = "0.3"
tokio-util = "0.7"
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.13"
rustls = "0.23"
rustls-native-certs = "0.8"
rustls-pemfile = "2"
suppaftp = { version = "6", features = ["async-native-tls"] }
async-std = "1"
dirs = "6"
open = "5"
base64 = "0.22"
sys-locale = "0.3"
reqwest = { version = "0.12", features = ["json", "stream", "blocking", "multipart"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
mysql_async = "0.36"
betteroffice-docx = "0.1.0"
betteroffice-xlsx = "0.1.0"
docx-parse = { package = "betteroffice-docx-parse", version = "0.1.0" }
ooxml-opc = { package = "betteroffice-opc", version = "0.1.0" }
xlsx-model = { package = "betteroffice-xlsx-model", version = "0.1.0" }
sha2 = "0.11.0"
sha2_10 = { package = "sha2", version = "0.10" }
aes-gcm = "0.10"
pbkdf2 = "0.12"
rand = "0.8"
hex = "0.4"
regex = "1"
# zip: keep only pure-Rust features so the Windows CI build has no native
# (C) compression dependencies. JAR/WAR/EAR archives use deflate or store.
zip = { version = "8.6.0", default-features = false, features = ["deflate", "deflate64", "bzip2-rs"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[dev-dependencies]
rusqlite = "0.32"
tempfile = "3"

# Performance optimization profiles
[profile.release]
opt-level = 3          # Maximum optimization
lto = true             # Link-time optimization
codegen-units = 1      # Better optimization, slower compile
strip = true           # Strip debug symbols
panic = "abort"        # Smaller binary size

[profile.dev]
opt-level = 0          # No optimization for faster compile
debug = true           # Include debug info

# Optional: Super optimized release
[profile.release-optimized]
inherits = "release"
opt-level = "z"        # Optimize for size
lto = "fat"            # Aggressive LTO
codegen-units = 1
