[package]
name = "nexterm"
version = "2.16.5"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "nexterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.1", features = [] }

[dependencies]
tauri = { version = "2.1", features = ["custom-protocol"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-wdio-webdriver = "1.3.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
russh = { version = "0.63", features = ["flate2"] }
russh-sftp = "2.4"
anyhow = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = "0.3"
tokio-tungstenite = "0.29"
futures = "0.3"
tokio-util = "0.7"
tokio-postgres = "0.7"
tokio-postgres-rustls = "0.13"
rustls = "0.23"
rustls-native-certs = "0.8"
rustls-pemfile = "2"
suppaftp = { version = "6", features = ["async-native-tls"] }
async-std = "1"
dirs = "6"
open = "5"
base64 = "0.22"
encoding_rs = "0.8"
sys-locale = "0.3"
reqwest = { version = "0.12", features = ["json", "stream", "blocking", "multipart"] }
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
mysql_async = "0.36"
betteroffice-docx = "0.1.0"
betteroffice-xlsx = "0.1.0"
docx-parse = { package = "betteroffice-docx-parse", version = "0.1.0" }
ooxml-opc = { package = "betteroffice-opc", version = "0.1.0" }
xlsx-model = { package = "betteroffice-xlsx-model", version = "0.1.0" }
sha2 = "0.11.0"
sha2_10 = { package = "sha2", version = "0.10" }
aes-gcm = "0.10"
pbkdf2 = "0.12"
rand = "0.8"
hex = "0.4"
regex = "1"
# zip: keep only pure-Rust features so the Windows CI build has no native
# (C) compression dependencies. JAR/WAR/EAR archives use deflate or store.
zip = { version = "8.6.0", default-features = false, features = ["deflate", "deflate64", "bzip2-rs"] }
# RDP client (remote desktop) — the IronRDP crate suite (Devolutions).
# ironrdp 0.17 re-exports pdu/connector/session/graphics/input/cliprdr/
# displaycontrol/… and pairs with ironrdp-tokio 0.10, whose connect helpers
# and Framed types are Send-safe for concrete tokio streams (usable from
# tokio::spawn/Tauri commands directly). ironrdp-tls handles the TLS upgrade,
# ironrdp-cliprdr-native the clipboard backend scaffolding. Requires
# russh >= 0.63 + the picky/sspi patches below for one crypto tree.
ironrdp = { version = "0.17", features = [
    "connector",
    "session",
    "graphics",
    "input",
    "cliprdr",
    "displaycontrol",
    "dvc",
    "svc",
] }
ironrdp-tokio = "0.10"
ironrdp-tls = { version = "0.2", features = ["rustls"] }
ironrdp-cliprdr-native = "0.7"
# VNC (RFB) client-side engine: async, tokio-based, works over any
# AsyncRead+AsyncWrite stream (so the SSH jump-host tunnel plugs straight
# in). Handles the RFB handshake, VNC-Auth DES challenge-response, and
# ZRLE/CopyRect/Raw framebuffer decoding. Community-active alternative to
# hand-rolling RFC 6143.
vnc-rs = "0.5"
# Pinned so the vendored picky/sspi patches below are always selected by the
# resolver (see the comment on [patch.crates-io]).
sspi = { version = "=0.21.3", default-features = false }
bytes = "1"
smallvec = "1"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

# System clipboard file-list support (SFTP panel copy/paste).
# macOS: NSPasteboard + NSURL (main-thread only, hence objc2).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSPasteboard"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSString", "NSURL", "NSValue"] }

# Windows: CF_HDROP / DROPFILES via raw clipboard APIs.
# Version aligned with the windows 0.61.3 already in the dependency tree
# (pulled by tao/tauri on the Windows target).
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_DataExchange",
    "Win32_System_Memory",
    "Win32_UI_Shell",
    "Win32_System_Ole",
] }

# Linux: text/uri-list via arboard (degraded mode; same 3.6.x as the
# clipboard-manager plugin already uses).
[target.'cfg(target_os = "linux")'.dependencies]
arboard = "3"

[dev-dependencies]
rusqlite = "0.32"
tempfile = "3"

# Performance optimization profiles
[profile.release]
opt-level = 3          # Maximum optimization
lto = true             # Link-time optimization
codegen-units = 1      # Better optimization, slower compile
strip = true           # Strip debug symbols
panic = "abort"        # Smaller binary size

[profile.dev]
opt-level = 0          # No optimization for faster compile
debug = true           # Include debug info

# Optional: Super optimized release
[profile.release-optimized]
inherits = "release"
opt-level = "z"        # Optimize for size
lto = "fat"            # Aggressive LTO
codegen-units = 1


# Upstream picky/sspi pin crypto prereleases (e.g. curve25519-dalek =5.0.0-rc.1)
# that can never satisfy russh 0.63's stable (^5) requirements, which made
# ironrdp 0.14+ and russh mutually exclusive on crates.io. Both crates have
# already moved to stable RustCrypto releases upstream; the vendors below are
# the community sources with minimal manifest edits:
#   - picky 7.0.0-rc.26 (stable crypto) with `version` renamed to 7.0.0-rc.25,
#     because ironrdp-connector 0.10 pins =7.0.0-rc.25 exactly.
#   - sspi 0.21.3 with its dead apple-target rc-pinned dependency blocks
#     removed (its sources import none of them on any target).
# The direct `sspi = "=0.21.3"` dependency above forces the resolver to pick
# 0.21.3 so the patch is always applied. Re-evaluate on the next ironrdp
# release: once ironrdp-connector depends on picky >= rc.26 and sspi >= 0.21.4
# both patches can be dropped.
[patch.crates-io]
picky = { path = "vendor/picky" }
sspi = { path = "vendor/sspi" }
